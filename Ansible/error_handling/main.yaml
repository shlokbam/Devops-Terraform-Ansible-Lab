---
- hosts: all
  become: true

  tasks:
   - name: ake sure the pakage openssh and openssl are up to date
     ansible.builtin.apt:
      name: "{{ item }}"
      state: latest
     loop:
      - openssh
      - openssl
     ignore_errors: yes
   - name: Verify if docker is installed
     ansible.builtin.command: docker --version
     register: output
     ignore_errors: yes
   - name: Install docker if not installed
     ansible.builtin.apt:
      name: docker.io
      state: present
     when :
      output.failed
     
     

     